# The signed release, started by hand: gh workflow run release.yml [-f version=x.y.z] [-f dry_run=true]
# build (tests, unsigned stage) -> sign (Azure Artifact Signing of the FlareAI.* PE files) -> package (zip)
# -> rsa (signs checksums.txt with the update key) -> publish (verifies everything, then draft, publish, tag).
# Only sign and rsa run in the "release" environment (main only). Publishing creates the tag, so a failed run burns no
# version. dry_run goes through the draft release, then deletes it: no tag, no published release.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'x.y.z (empty: the next patch after the latest release)'
        required: false
        type: string
      dry_run:
        description: 'Run everything up to the draft release, then delete the draft'
        type: boolean
        default: false

permissions: {}   # each job asks for its own

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'abmorrill4/house-style' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0   # release notes come from tags
          persist-credentials: false

      - name: Version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$(git tag -l 'v*')" ] || { echo "No v* tags in the checkout."; exit 1; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          latest=${latest#v}
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            IFS=. read -r a b c <<< "$latest"
            v="$a.$b.$((c + 1))"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a plain x.y.z version: $v"; exit 1; }
          if [ "$v" = "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)" != "$v" ]; then
            echo "$v is not newer than $latest."; exit 1
          fi
          if [ -n "$(git tag -l "v$v")" ]; then echo "Tag v$v exists."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v (latest is $latest)."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test FlareAI.sln -c Release

      - name: Stage
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:VERSION -StageOnly

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: dist/stage/
          if-no-files-found: error

  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC login to Azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: dist/stage

      - name: Sign list
        shell: pwsh
        run: |
          # The exact FlareAI.* PE files the updater checks; paths relative to the catalog, which sits in dist\.
          $dist = (Resolve-Path dist).Path
          $files = @(./scripts/release/Get-SignFiles.ps1 -Dir "$dist\stage\FlareAI")
          if ($files.Count -lt 4) { throw "Expected at least 4 files to sign, found $($files.Count)." }
          $files | ForEach-Object { $_.Substring($dist.Length + 1) } | Set-Content "$dist\signlist.txt" -Encoding ascii
          Get-Content "$dist\signlist.txt"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\dist\signlist.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Verify signatures
        shell: pwsh
        run: ./scripts/release/Test-Signed.ps1 -Dir dist/stage/FlareAI

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-stage
          path: dist/stage/
          if-no-files-found: error

  package:
    needs: [build, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-stage
          path: dist/stage

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/zip.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip
          path: dist/HouseStyle-${{ needs.build.outputs.version }}.zip
          if-no-files-found: error

  rsa:
    # Holds the update key. No id-token and no third-party actions (actions/download-artifact is GitHub's own).
    needs: [build, package]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zip
          path: dist

      - name: Checksums and signature
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set in the release environment." }
          $name = "HouseStyle-$env:VERSION.zip"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format, no BOM: the signature covers these exact bytes.
          [IO.File]::WriteAllBytes("dist/checksums.txt", [Text.Encoding]::ASCII.GetBytes("$hash  $name`n"))
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.FromXmlString($env:SIGNING_KEY)
            $sig = $rsa.SignData([IO.File]::ReadAllBytes("dist/checksums.txt"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          } finally { $rsa.Dispose() }
          [IO.File]::WriteAllText("dist/checksums.txt.sig", [Convert]::ToBase64String($sig))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/checksums.txt
            dist/checksums.txt.sig
          if-no-files-found: error

  publish:
    needs: [build, rsa]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # the release and its tag
      actions: write    # start pages.yml
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zip
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist

      - name: Release notes
        shell: pwsh
        run: |
          if (-not (git tag -l 'v*')) { throw "No v* tags in the checkout." }
          $notes = (& ./scripts/release/Build-WhatsNew.ps1 -Version $env:VERSION -NotesOnly) -join "`n"
          $notes | Set-Content release-body.md -Encoding utf8

      - name: Remove an old draft of this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $all = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
          foreach ($page in $all) { foreach ($r in $page) { if ($r.draft -and $r.tag_name -eq $tag) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($r.id)" } } }

      - name: Verify
        shell: powershell   # Windows PowerShell 5.1: the same .NET Framework the plugin runs on
        run: |
          $ErrorActionPreference = "Stop"
          $zip = (Resolve-Path "dist\HouseStyle-$env:VERSION.zip").Path
          $sums = [IO.File]::ReadAllBytes((Resolve-Path dist\checksums.txt).Path)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([Text.Encoding]::ASCII.GetString($sums) -ne "$hash  HouseStyle-$env:VERSION.zip`n") { throw "checksums.txt doesn't match the zip." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, "$PWD\dist\verify")
          .\scripts\release\Test-Signed.ps1 -Dir dist\verify\FlareAI
          # The RSA signature must verify with the public key compiled into the shipped FlareAI.Core.dll.
          $core = [Reflection.Assembly]::LoadFrom((Resolve-Path dist\verify\FlareAI\FlareAI.Core.dll).Path)
          $t = $core.GetType("FlareAI.Core.Update.UpdateSigning")
          $key = $t.GetField("PublicKeyXml").GetRawConstantValue()
          $sig = [IO.File]::ReadAllText((Resolve-Path dist\checksums.txt.sig).Path)
          if (-not $t.GetMethod("Verify").Invoke($null, @($sums, $sig, $key))) { throw "checksums.txt.sig doesn't verify with the key in FlareAI.Core.dll." }
          Write-Host "Verified."

      - name: Draft, publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $files = "dist/HouseStyle-$env:VERSION.zip", "dist/checksums.txt", "dist/checksums.txt.sig"
          gh release create $tag @files --title "House Style $env:VERSION" --notes-file release-body.md --draft --target $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw "Couldn't create the draft." }
          if ($env:DRY_RUN -eq 'true') { Write-Host "Dry run: draft created, not published."; exit 0 }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { throw "Couldn't publish." }

      - name: Refresh the site
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Delete the draft
        # A dry run, or a failure before publishing. A published release is never a draft, so it is left alone.
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $all = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp | ConvertFrom-Json
          foreach ($page in $all) { foreach ($r in $page) { if ($r.draft -and $r.tag_name -eq $tag) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($r.id)" } } }
