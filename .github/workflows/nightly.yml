# The nightly release: if anything that ships changed since the last release, tag the next patch version on main and
# start build.yml on that tag, which builds, signs and publishes it. No approval click (owner decision 2026-10-24).
# It tags nothing while the FACTORY_MODE variable is off or unset (the factory's kill switch).
# The tag ruleset blocks moving or deleting v* tags, and only a release started by this workflow publishes (the
# release job in build.yml checks that through the API). GitHub doesn't start workflows from a tag this job's
# token pushes, so the build is started with a workflow_dispatch, which it does allow, carrying this run's id; the
# release job checks through the API that the id is a nightly.yml run on main. This job waits for that build and
# reports any failure, its own or the build's, on the pinned "Nightly release" issue.
name: nightly
on:
  schedule:
    - cron: '7 8 * * *'   # 08:07 UTC, about 3 a.m. Eastern; off the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Say what would be released, without tagging'
        type: boolean
        default: false
permissions:
  contents: write   # create the tag
  actions: write    # start build.yml on it
  issues: write     # report a failure
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'abmorrill4/house-style' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release if anything shipped changed
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE }}
        run: |
          set -euo pipefail
          # The factory's kill switch: off, unset or anything but shadow or live (any case) tags nothing.
          mode=$(printf '%s' "${FACTORY_MODE:-}" | tr '[:upper:]' '[:lower:]')
          if [ "$mode" != "shadow" ] && [ "$mode" != "live" ]; then echo "FACTORY_MODE is off or unset, so nothing is tagged."; exit 0; fi
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          changed_since() { [ -n "$(git diff --name-only "$1" HEAD -- src styleguide ':(exclude)*.md')" ]; }
          release=""
          if ! gh release view "$last" -R "$REPO" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            # The newest tag never got a published release (a failed night). Tags can't be moved or deleted, so a tag
            # that fails at its own commit would block every release after it: when there are newer changes, release
            # those as the next version and leave the stuck tag behind; otherwise try it once more.
            echo "::warning::$last was tagged but never published."
            echo "stuck=$last" >> "$GITHUB_ENV"   # for the failure report below
            stuck="$last"                          # and for this step: GITHUB_ENV only reaches later steps
            if changed_since "$last"; then base="$last"; else release="$last"; fi
          else
            base="$last"
          fi
          if [ -z "$release" ]; then
            if ! changed_since "$base"; then echo "Nothing shipped changed since $base."; exit 0; fi
            IFS=. read -r major minor patch <<< "${base#v}"
            release="v$major.$minor.$((patch + 1))"
            sha=$(git rev-parse HEAD)
            echo "Releasing $release at $sha."
            pwsh -NoProfile -File scripts/release/Build-WhatsNew.ps1 -Version "${release#v}" -NotesOnly
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: no tag."; exit 0; fi
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$release" -f sha="$sha" >/dev/null
          elif [ "$DRY_RUN" = "true" ]; then echo "Dry run: would build $release again."; exit 0; fi
          gh workflow run build.yml -R "$REPO" --ref "$release" -f nightly_run="$RUN_ID"
          # Wait for that build and fail with it, so the failure is reported below.
          for i in $(seq 1 30); do
            id=$(gh run list -R "$REPO" -w build.yml -b "$release" -e workflow_dispatch -L 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break; sleep 10
          done
          [ -n "$id" ] || { echo "The build for $release never started."; exit 1; }
          gh run watch "$id" -R "$REPO" --exit-status --interval 30 > /dev/null
          if [ -n "${stuck:-}" ] && [ "$stuck" != "$release" ]; then echo "::warning::Released $release; $stuck stays unpublished."; exit 1; fi
          exit 0   # a false test above must not fail the step under set -e

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only the issue this workflow opened (author github-actions[bot]), never one anyone could have created. Read
          # through the API: gh issue list --author doesn't find the bot's issues, so a new one was opened every time.
          n=$(gh api "repos/$REPO/issues?state=open&creator=app%2Fgithub-actions&per_page=100" --jq '[.[] | select(.title == "Nightly release" and .user.login == "github-actions[bot]")] | sort_by(.number) | .[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create -R "$REPO" --title "Nightly release" --body "Failures of the nightly release are reported here.")
            n="${url##*/}"
            gh issue pin "$n" -R "$REPO" || true
          fi
          msg="The nightly release needs a look: $RUN"
          [ -n "${stuck:-}" ] && msg="$msg (tag $stuck was never published)"
          gh issue comment "$n" -R "$REPO" --body "$msg"
