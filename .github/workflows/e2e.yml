# Installs the plugin into real Flare on the self-hosted "flare" runner (the owner's Flare VM) and runs tests/e2e.
# By hand only (workflow_dispatch): VM testing is not triggered by git. The build factory runs the e2e on the VMs before a merge
# (scripts/vm-e2e.ps1 in the factory repo, which calls tests/e2e/Run-FlareE2E.ps1).
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'abmorrill4/house-style'
    runs-on: [self-hosted, windows, flare]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the Flare VM is ready
        shell: powershell
        # From main, so a branch can't change its own check. Exits 1 with the reason when the VM can't drive Flare.
        run: |
          $ErrorActionPreference = 'Continue'   # git's stderr is not an error here; its exit code decides
          git fetch --no-tags --depth=1 origin main
          $check = Join-Path $env:RUNNER_TEMP 'Test-FlareReady.ps1'
          (git show origin/main:tests/e2e/Test-FlareReady.ps1) | Set-Content -Encoding UTF8 $check
          if ($LASTEXITCODE) { Write-Host "::error::main has no tests/e2e/Test-FlareReady.ps1."; exit 1 }
          & $check
          exit $LASTEXITCODE

      - name: Run the scenarios in Flare
        shell: powershell
        env:
          # The ai-* scenarios need AI. This runner keeps state between jobs, so it never gets ANTHROPIC_API_KEY. All its
          # AI goes through the owner's Bifrost gateway (aigw.praeviderant.com) with a virtual key that is for this Flare
          # VM only (owner, 2026-10-27; saved as FACTORY_TEST_ANTHROPIC_KEY, BIFROST_VK wins when set).
          HOUSESTYLE_TEST_BIFROST_KEY: ${{ secrets.BIFROST_VK || secrets.FACTORY_TEST_ANTHROPIC_KEY || '' }}
          HOUSESTYLE_TEST_BIFROST_URL: ${{ vars.BIFROST_URL || 'https://aigw.praeviderant.com' }}
          ANTHROPIC_API_KEY: ''   # blanks any copy in the runner's own environment
        run: |
          $noAi = -not $env:HOUSESTYLE_TEST_BIFROST_KEY
          if ($noAi) { Write-Host "Skipping the ai-* scenarios: this run has no key." }
          try { $null = Invoke-WebRequest "$env:HOUSESTYLE_TEST_BIFROST_URL/health" -UseBasicParsing -TimeoutSec 10; Write-Host "The AI gateway answers." }
          catch {
            if (-not $noAi) { Write-Host "::error::The AI gateway doesn't answer from this runner: $($_.Exception.Message)"; exit 1 }
            Write-Host "::warning::The AI gateway doesn't answer from this runner: $($_.Exception.Message)"
          }
          # Seconds since the push, so it includes the runner wait, checkout and the ready check. -1 when this isn't a push.
          $queue = -1
          if ('${{ github.event_name }}' -eq 'push') { try { $queue = [int](([DateTimeOffset]::UtcNow) - ([DateTimeOffset]::FromUnixTimeSeconds([long]'${{ github.event.repository.pushed_at }}'))).TotalSeconds } catch { $queue = -1 } }
          & .\tests\e2e\Run-FlareE2E.ps1 -Install -OutDir "$env:RUNNER_TEMP\e2e-results" -NoAi:$noAi -QueueSeconds $queue
          exit $LASTEXITCODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results/
          if-no-files-found: ignore

