# Installs the plugin into real Flare on the self-hosted "flare" runner (the owner's factory VM) and runs tests/e2e.
# Triggered by pushes to this repository's branches, nightly and by hand, never by pull_request: for a pull_request event GitHub
# runs the workflow file from the PR itself, so a fork could rewrite any guard here. Pushing a branch needs write
# access (the owner, and the factory acting for the owner). A branch with an open PR shows this run on the PR too.
name: e2e

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'   # nightly, well after the factory VM's 03:00 reset (owner's time, EST or EDT); the AI scenarios run here

permissions:
  contents: read

# No concurrency group: the single "flare" runner already runs one job at a time, and a group keeps only one waiting
# run, cancelling the older ones.

jobs:
  e2e:
    if: github.repository == 'abmorrill4/house-style'
    runs-on: [self-hosted, windows, flare]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # a factory branch's diff from main decides whether the ai-* scenarios run

      - name: Check the Flare VM is ready
        shell: powershell
        # From main, so a branch can't change its own check. Exits 1 with the reason when the VM can't drive Flare.
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'Test-FlareReady.ps1'
          $text = git show origin/main:tests/e2e/Test-FlareReady.ps1 2>$null
          # ponytail: main had it under scripts/factory until the factory moved out (PR 275); drop this once merged.
          if ($LASTEXITCODE) { $text = git show origin/main:scripts/factory/Test-FactoryReady.ps1 }
          $text | Set-Content -Encoding UTF8 $check
          & $check
          exit $LASTEXITCODE

      - name: Run the scenarios in Flare
        shell: powershell
        env:
          # The ai-* scenarios need AI, so they run on main, nightly, by hand, and on the build factory's factory/*
          # branches whose change touches the AI (aiPaths in tests/e2e/ai-paths.json on main), where they gate the merge (owner decision
          # 2026-10-26). This runner also runs agent-written code from factory/* branches and keeps state between jobs,
          # so it never gets ANTHROPIC_API_KEY. All its AI goes through the owner's Bifrost gateway
          # (aigw.praeviderant.com) with a virtual key that is for this Flare VM only (owner, 2026-10-27; saved as
          # FACTORY_TEST_ANTHROPIC_KEY, BIFROST_VK wins when set). Other branch pushes skip the ai-* scenarios.
          HOUSESTYLE_TEST_BIFROST_KEY: ${{ (startsWith(github.ref_name, 'factory/') || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (secrets.BIFROST_VK || secrets.FACTORY_TEST_ANTHROPIC_KEY) || '' }}
          HOUSESTYLE_TEST_BIFROST_URL: ${{ vars.BIFROST_URL || 'https://aigw.praeviderant.com' }}
          ANTHROPIC_API_KEY: ''   # blanks any copy in the runner's own environment
        run: |
          $factory = $env:GITHUB_REF_NAME -like 'factory/*'
          if ($factory) {
            # Only a change that touches the AI runs the ai-* scenarios. The list is read from main, so the branch
            # can't change it. A change that needs them and has no key fails instead of skipping AI.
            $aiPaths = ((git show origin/main:tests/e2e/ai-paths.json) -join "`n" | ConvertFrom-Json).aiPaths
            $changed = @(git -c core.quotePath=false diff --name-only --no-renames origin/main...HEAD)
            $touchesAi = @($changed | Where-Object { $_ -match $aiPaths }).Count -gt 0
            if (-not $touchesAi) { $env:HOUSESTYLE_TEST_BIFROST_KEY = '' }
            elseif (-not $env:HOUSESTYLE_TEST_BIFROST_KEY) { Write-Host "::error::This change touches the AI and needs the Bifrost key secret to run the ai-* scenarios."; exit 1 }
          }
          $noAi = -not $env:HOUSESTYLE_TEST_BIFROST_KEY
          if ($noAi) { Write-Host "Skipping the ai-* scenarios: this run has no key, or the change doesn't touch the AI." }
          # Checked on every run, so any push shows whether this runner reaches the gateway. A run that needs it fails.
          try { $null = Invoke-WebRequest "$env:HOUSESTYLE_TEST_BIFROST_URL/health" -UseBasicParsing -TimeoutSec 10; Write-Host "The AI gateway answers." }
          catch {
            if (-not $noAi) { Write-Host "::error::The AI gateway doesn't answer from this runner: $($_.Exception.Message)"; exit 1 }
            Write-Host "::warning::The AI gateway doesn't answer from this runner: $($_.Exception.Message)"
          }
          & .\tests\e2e\Run-FlareE2E.ps1 -Install -OutDir "$env:RUNNER_TEMP\e2e-results" -NoAi:$noAi
          exit $LASTEXITCODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results/
          if-no-files-found: ignore
