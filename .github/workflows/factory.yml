# The factory: every 30 minutes, triage the new tester reports in the private reports repo, one at a time, and post
# each brief and proposed route on the private report (scripts/factory/README.md). It builds no fixes: the owner
# approves roadmap issues and Claude builds them through the work loop (owner decision 2026-10-26). The FACTORY_MODE
# variable is the kill switch: shadow runs triage, off, unset or anything else means no run at all.
# Scheduled and manual runs only, on the factory VM's runner. Guards: scripts/factory/README.md.
name: factory
on:
  schedule:
    - cron: '17,47 * * * *'   # off the hour and half hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      issue:
        description: 'A report number to work on now (optional)'
        required: false
      dry_run:
        description: 'Do everything except push, PR, merge, label and comment'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: factory   # one factory run at a time; the e2e workflow has no group, so it never cancels these
  cancel-in-progress: false
jobs:
  factory:
    # Fails closed: only shadow or live (any case) starts the job, and the script checks again before anything else.
    if: github.repository == 'abmorrill4/house-style' && vars.FACTORY_MODE == 'shadow'
    runs-on: [self-hosted, windows, flare]
    # A routed bug is triaged, fixed, tested in Flare and reviewed in one run: three agents at most 45 minutes each
    # (limits.agentMinutes in rules/routing.json), the tests, and up to an hour waiting for CI.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the factory VM is ready
        shell: powershell
        run: .\scripts\factory\Test-FactoryReady.ps1   # exits 1 with the reason when the VM can't drive Flare

      - name: Work through the queue
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          # The agents use the owner's subscription token when it is set, else the API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
          # off or shadow. Unset or anything else is off, and the script stops before it reads or writes anything.
          FACTORY_MODE: ${{ vars.FACTORY_MODE }}
        run: |
          git config user.name "House Style factory"
          git config user.email "factory@gethousestyle.com"
          $a = @()
          if ($env:ISSUE) { $a += @("-Issue", [int]$env:ISSUE) }
          if ($env:DRY_RUN -eq 'true') { $a += "-DryRun" }
          # Drain the queue: one report per pass, each pass in its own process, until nothing is left. A single report
          # (issue input) or a dry run is one pass. The job timeout and the daily agent-run cap bound the rest; a pass
          # that fails has already marked its report (failed or stuck), so the next pass moves on to another one.
          $passes = if ($env:ISSUE -or $env:DRY_RUN -eq 'true') { 1 } else { 12 }
          $failed = 0
          $ErrorActionPreference = 'Continue'   # a pass's stderr lines are output here, not errors; exit codes decide
          for ($i = 1; $i -le $passes; $i++) {
            $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\factory\Invoke-Factory.ps1 @a 2>&1 | ForEach-Object { "$_" }
            $out | Write-Host
            if ($LASTEXITCODE) { $failed++ }
            if ($out -match 'Nothing to triage and no fix approved|waits for tomorrow') { break }
          }
          if ($failed) { throw "$failed of the passes failed. The reasons are on the reports, in the private reports repo." }
