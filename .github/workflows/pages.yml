# Publishes site/ (plain static HTML and CSS) to GitHub Pages, with the user guide built into site/guide/.
# Repo Settings > Pages > Source must be "GitHub Actions".
# Two jobs: the build runs repo code with read-only access and no stored credentials; only the deploy job, which runs
# no repo code, holds the Pages and OIDC permissions.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/user-guide/**', 'scripts/build-guide.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the user guide into site/guide
        run: python3 scripts/build-guide.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
