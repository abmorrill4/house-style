# Publishes site/ (plain static HTML and CSS) to GitHub Pages, with the user guide built into site/guide/.
# Repo Settings > Pages > Source must be "GitHub Actions".
# Two jobs: the build runs repo code with read-only access and no stored credentials; only the deploy job, which runs
# no repo code, holds the Pages and OIDC permissions.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/user-guide/**', 'scripts/build-guide.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the user guide into site/guide
        run: python3 scripts/build-guide.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
