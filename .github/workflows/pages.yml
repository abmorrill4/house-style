# Publishes site/ (plain static HTML and CSS) to GitHub Pages, with the user guide built into site/guide/.
# Repo Settings > Pages > Source must be "GitHub Actions".
# Two jobs: the build runs repo code with read-only access and no stored credentials; only the deploy job, which runs
# no repo code, holds the Pages and OIDC permissions.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/user-guide/**', 'scripts/build-guide.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the user guide into site/guide
        run: python3 scripts/build-guide.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
