# Publishes site/ (plain static HTML and CSS) to GitHub Pages, with the documentation (docs-site, Astro Starlight) built
# into site/docs and a redirect page for each page of the retired user guide in site/guide.
# Repo Settings > Pages > Source must be "GitHub Actions".
# Two jobs: the build runs repo code with read-only access and no stored credentials; only the deploy job, which runs
# no repo code, holds the Pages and OIDC permissions.
# It also runs every morning, and release.yml starts it after publishing, so the release notes page lists the newest version.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'styleguide/**'
      - 'changes/**'
      - 'PLAN.md'
      - 'CLAUDE.md'
      - 'src/FlareAI.Flare/whats-new.md'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'

      - name: Install the docs dependencies
        working-directory: docs-site
        run: npm ci --ignore-scripts

      - name: Build the docs
        working-directory: docs-site
        env:
          # The job's own read-only token, only so the GitHub API lets the build read the releases list. No stored secret.
          GITHUB_TOKEN: ${{ github.token }}
          RELEASES_REQUIRED: '1'
        run: npm run build

      - name: Put the docs next to the site and redirect the old guide
        run: |
          mkdir -p site/docs
          cp -R docs-site/dist/. site/docs/
          node docs-site/scripts/guide-redirects.mjs site/guide

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
