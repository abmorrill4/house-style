# Builds and tests on every push and PR. A release tag (v0.2.0) also packages the plugin, and the release job signs
# checksums.txt and publishes HouseStyle-0.2.0.zip, checksums.txt and checksums.txt.sig. Release tags come only from
# nightly.yml, which creates the tag and starts this workflow on it. The release job refuses any run not started by a
# running nightly.yml on main and any tag not on main, and the tag ruleset blocks moving or deleting v* tags.
# Installed copies only take an update whose signature matches the key built into them.
# Builds against ref\ (stubs of the Flare API), so no MadCap files are needed here.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # labeled: the no-notes label takes effect at once
  workflow_dispatch:
    inputs:
      nightly_run:
        description: 'Set by nightly.yml: the run that started this release'
        required: false

# A newer push to a pull request makes the older run pointless, so the older one is cancelled. A push to main and a release
# tag are never cancelled, because each run id is its own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read   # only the release job writes

jobs:
  changes:
    # A PR that only touches Markdown under docs/ or at the root skips build and feedback-worker.
    # Skipped jobs still satisfy the required checks.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Fail safe: if the diff can't be read or is empty, run everything.
          files=$(git diff --name-only --no-renames "$BASE" HEAD) || { echo "code=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(docs/.*|[^/]*)[.]md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The Confluence publisher has its own tests: they run only when it, its tests or the guide it publishes change.
          if echo "$files" | grep -qE '^(scripts/publish-guide-to-confluence[.]ps1|tests/publish-guide/|styleguide/)' || [ -z "$files" ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}   # runs if changes failed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the bench gate's PR checks diff against the base branch
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test FlareAI.sln -c Release   # Core, scenarios, rule fixtures (ratchet), scoring, corpus kit

      - name: Release notes for writers
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # A change writers can see needs a changes/<name>.md note (or the no-notes label). See changes/README.md.
          $files = @(git diff --name-only --no-renames --diff-filter=ACMRD $env:BASE HEAD)
          $shipping = @($files | Where-Object { ($_ -like 'src/*' -or $_ -like 'styleguide/*') -and $_ -notlike '*.md' })   # CLAUDE.md and comments in Markdown don't ship
          $notes = @(git diff --name-only --diff-filter=A $env:BASE HEAD -- changes/ | Where-Object { $_ -like 'changes/*.md' -and $_ -ne 'changes/README.md' })
          foreach ($n in $notes) { if (-not (Select-String -Path $n -Pattern '^- ' -Quiet)) { throw "$n has no '- ' bullet, so it would add nothing to the release notes." } }
          if ($shipping.Count -and -not $notes.Count -and ($env:PR_LABELS -split ',') -notcontains 'no-notes') {
            throw "This PR changes src/ or styleguide/ but adds no changes/<name>.md note for writers. Add one, or the no-notes label if writers won't notice."
          }

      - name: Script tests (Pester, Windows PowerShell 5.1)
        shell: powershell
        # The tests use Pester 3.x syntax; runners also have Pester 5, which Invoke-Pester would pick by default.
        # The guide publisher's mock-Confluence tests run only when the publisher or the guide it publishes changes.
        env:
          PUBLISH: ${{ needs.changes.outputs.publish }}
        run: |
          Import-Module Pester -MaximumVersion 3.99 -Force
          $paths = @('tests/release', 'tests/e2e')
          if ($env:PUBLISH -ne 'false') { $paths += 'tests/publish-guide' }
          Invoke-Pester $paths -EnableExit

      - name: Bench gate (lint only, offline)
        shell: pwsh
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-baseline.ps1   # vs tests/baselines/bench-lint.json; regenerate: FlareAI.Bench.exe --no-ai --update-baseline

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-lint
          path: bench-out/gate/
          if-no-files-found: ignore

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-ci' }
          # The tag name ends up in scripts and file names: only a plain version gets through.
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a version tag: $env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:VERSION

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HouseStyle-${{ steps.v.outputs.version }}
          path: dist/stage/

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/HouseStyle-${{ steps.v.outputs.version }}.zip
            dist/checksums.txt
          if-no-files-found: error

    outputs:
      version: ${{ steps.v.outputs.version }}

  release:
    # Only this job can write to the repo. The "release" environment holds the signing key and deploys only v* tags.
    # The run must come from nightly.yml (a workflow_dispatch by the GitHub Actions app), and the tag must be on main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Started by the nightly release, tag on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          NIGHTLY_RUN: ${{ inputs.nightly_run }}
        run: |
          if ($env:EVENT -ne 'workflow_dispatch' -or $env:ACTOR -ne 'github-actions[bot]') { throw "Releases come only from nightly.yml (got $env:EVENT by $env:ACTOR)." }
          # The run id it passed must be a nightly.yml run on main in this repo, and still running.
          if ($env:NIGHTLY_RUN -notmatch '^\d+$') { throw "No nightly run id." }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NIGHTLY_RUN" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/nightly.yml' -or $run.head_branch -ne 'main' -or $run.status -eq 'completed') {
            throw "Run $env:NIGHTLY_RUN is not a running nightly.yml on main."
          }
          git fetch --quiet origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tagged commit is not on main." }

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # In its own step, so the notes script never runs where the signing key is.
          $note = 'Right-click the zip > Properties > Unblock before you unzip it.'
          $notes = (& ./scripts/release/Build-WhatsNew.ps1 -Version $env:VERSION -NotesOnly) -join "`n"
          "$note`n`n$notes" | Set-Content release-body.md -Encoding utf8

      - name: Sign and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $zip = "dist/HouseStyle-$env:VERSION.zip"
          # checksums.txt (sha256sum format) is made by package.ps1; the update refuses a zip whose SHA-256 doesn't match it (#101).
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content dist/checksums.txt -Raw) -notmatch "^$hash  ") { throw "checksums.txt doesn't match the zip." }
          # The signature installed copies check: RSA-SHA256 (PKCS#1 v1.5) over the exact bytes of checksums.txt.
          if (-not $env:SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set in the release environment." }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.FromXmlString($env:SIGNING_KEY)
            $sig = $rsa.SignData([IO.File]::ReadAllBytes("dist/checksums.txt"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          } finally { $rsa.Dispose() }
          [IO.File]::WriteAllText("dist/checksums.txt.sig", [Convert]::ToBase64String($sig))
          $env:SIGNING_KEY = $null
          # Draft first, then publish: releases are immutable once published, so every file goes up before that.
          gh release create $env:GITHUB_REF_NAME $zip dist/checksums.txt dist/checksums.txt.sig --title "House Style $env:VERSION" --notes-file release-body.md --verify-tag --draft
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest

  feedback-worker:
    # The Cloudflare Worker that receives in-app reports (#124). Tests only; the owner deploys it by hand (see its README).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}   # runs if changes failed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/feedback-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/feedback-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

