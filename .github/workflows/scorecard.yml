# The factory's weekly scorecard: every Monday, counts and reason codes for the week on the "Factory scorecard" issue
# in the private reports repo (scripts/factory/Post-Scorecard.ps1). No report text, titles or numbers, so a dry run
# prints it to this public job log.
name: scorecard
on:
  schedule:
    - cron: '41 13 * * 1'   # Mondays 13:41 UTC, morning in the US; off the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the scorecard instead of posting it'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scorecard
  cancel-in-progress: false
jobs:
  scorecard:
    if: github.repository == 'abmorrill4/house-style'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # reverts are read from main's history
          persist-credentials: false
      - name: Post the scorecard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $a = @{}
          if ($env:DRY_RUN -eq 'true') { $a.DryRun = $true }
          & ./scripts/factory/Post-Scorecard.ps1 @a
