# Proposes updates for the workflow actions, the NuGet packages and the feedback worker's npm packages.
# Each proposal is an ordinary pull request, so it runs the usual checks. Nothing here merges by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tools/*
      - /tests/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Flare loads its own Newtonsoft.Json 13.0.3, so the plugin must be built against exactly that version.
      # 13.0.4 adds JToken.ToString(Formatting), which Flare's copy lacks ("Method not found" at runtime).
      - dependency-name: Newtonsoft.Json

  - package-ecosystem: npm
    directory: /tools/feedback-worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
